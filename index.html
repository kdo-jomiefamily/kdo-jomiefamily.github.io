<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KDO</title>
<meta name="description" content="Les envies de toute la famille">
<meta name="theme-color" content="#FF3D6E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KDO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: strong pink band (logo, "you are", family strip), then one big wish grid per person. Modals for editing. */
:root{
  --brand:#FF3D6E; --brand-deep:#D62657; --on-brand:#FFFFFF;
  --bg:#FFF3F6; --surface:#FFFFFF; --surface-2:#FFE6EE; --ink:#2B1430; --ink-2:#7A5670; --line:#F6D3DE;
  --sun:#FFB627; --mint:#17B48A; --sky:#4D7CFE; --grape:#8E5BFF;
  --scrim:rgba(43,20,48,.45); --chip:#FFFFFF;
  --shadow:0 1px 0 rgba(43,20,48,.05), 0 14px 30px -16px rgba(120,20,60,.38);
  --f-display:'Bagel Fat One','Nunito',ui-rounded,system-ui,sans-serif;
  --f-body:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#F2386A; --brand-deep:#B51E4C; --on-brand:#FFFFFF;
    --bg:#1E0E18; --surface:#2B1522; --surface-2:#3A1D2E; --ink:#FFEFF4; --ink-2:#D6A9BE; --line:#4A2639;
    --sun:#FFC24D; --mint:#3DD3A8; --sky:#7096FF; --grape:#A47BFF;
    --scrim:rgba(10,3,8,.65); --chip:#3A1D2E;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 16px 34px -18px rgba(0,0,0,.8); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#F2386A; --brand-deep:#B51E4C; --on-brand:#FFFFFF;
  --bg:#1E0E18; --surface:#2B1522; --surface-2:#3A1D2E; --ink:#FFEFF4; --ink-2:#D6A9BE; --line:#4A2639;
  --sun:#FFC24D; --mint:#3DD3A8; --sky:#7096FF; --grape:#A47BFF;
  --scrim:rgba(10,3,8,.65); --chip:#3A1D2E;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 16px 34px -18px rgba(0,0,0,.8); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
body{margin:0}
img{max-width:100%}
button:disabled{opacity:.6;cursor:default}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:12px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* Pink band */
.band{background:
  radial-gradient(circle at 8% 30%, rgba(255,255,255,.22) 0 5px, transparent 6px),
  radial-gradient(circle at 92% 18%, rgba(255,255,255,.2) 0 8px, transparent 9px),
  radial-gradient(circle at 70% 80%, rgba(255,255,255,.14) 0 4px, transparent 5px),
  radial-gradient(circle at 35% 12%, rgba(255,214,102,.5) 0 3px, transparent 4px),
  var(--brand);
  color:var(--on-brand);border-radius:0 0 36px 36px;box-shadow:0 18px 40px -24px rgba(180,20,70,.7)}
.band-in{padding-block:18px 8px;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:46px;line-height:1;letter-spacing:.03em;display:inline-flex;color:#fff;text-shadow:0 4px 0 var(--brand-deep)}
.logo span{display:inline-block;animation:drop .75s cubic-bezier(.2,1.6,.4,1) backwards}
.logo span:nth-child(2){animation-delay:.08s;color:#FFE08A} .logo span:nth-child(3){animation-delay:.16s;transform:rotate(8deg)}
@keyframes drop{from{transform:translateY(-26px) rotate(-14deg)}}
.tag{font-weight:800;font-size:14px;opacity:.92}
.whoami{position:relative;display:flex;align-items:center;gap:10px}
.lbl{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.09em;opacity:.85}
.who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);border-radius:999px;padding:4px 14px 4px 4px;font-weight:900;color:#fff}
.who:hover{background:rgba(255,255,255,.28)}
.invite{display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--brand-deep);border:0;border-radius:999px;padding:8px 14px;font-weight:900;font-size:13px;box-shadow:0 3px 0 rgba(120,10,50,.25);margin-right:6px;transition:transform .15s}
.invite:hover{transform:translateY(-1px)}
.invite svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:560px){.invite span{display:none}.invite{padding:8px 10px}.whoami .lbl{display:none}}
.caret{width:9px;height:9px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg) translateY(-3px);margin-left:2px}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:6px;min-width:240px;box-shadow:var(--shadow);z-index:30;animation:pop .22s cubic-bezier(.2,1.5,.4,1)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:6px 10px 6px 6px;border-radius:12px;font-weight:800;text-align:left}
.menu button:hover,.menu button.on{background:var(--surface-2)}
.menu .note{font-size:12px;color:var(--ink-2);padding:6px 10px 4px;line-height:1.35}

/* Avatars */
.av{display:inline-block;border-radius:50%;overflow:hidden;flex:none;background:var(--surface-2);line-height:0}
.av svg,.av img{width:100%;height:100%;display:block;object-fit:cover}
.av.xs{width:22px;height:22px} .av.sm{width:34px;height:34px} .av.md{width:66px;height:66px} .av.lg{width:100px;height:100px}

.ava .a-head{transform-box:view-box;transform-origin:60px 92px;animation:sway 5s ease-in-out infinite;animation-delay:var(--d,0s)}
.ava .a-breathe,.ava .a-hold{transform-box:view-box;transform-origin:60px 120px;animation:breathe 3.4s ease-in-out infinite;animation-delay:var(--d,0s)}
.ava .a-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite;animation-delay:var(--d,0s)}
.ava .a-bob{transform-box:view-box;transform-origin:82px 116px;animation:balloon 3.6s ease-in-out infinite}
.ava .a-float{transform-box:fill-box;transform-origin:center;animation:floaty 2.8s ease-in-out infinite}
.ava .a-float2{animation-delay:-1.4s}
.ava .a-zz{animation:zz 3s ease-in-out infinite} .ava .a-zz2{animation-delay:-1.5s}
.ava .a-twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.ava .a-steam{animation:steam 2.4s ease-in-out infinite}
.ava.emo-rieur .a-head{animation:laugh .55s ease-in-out infinite}
.ava.emo-surpris .a-head{animation:hop 2.2s cubic-bezier(.3,1.6,.5,1) infinite}
.ava.emo-endormi .a-head{animation:doze 4.5s ease-in-out infinite}
.ava.emo-clin .a-head{animation:tilt 3.2s ease-in-out infinite}
.ava.emo-cool .a-head{animation:nod 2.4s ease-in-out infinite}
.ava.emo-boudeur .a-head{animation:huff 2.8s ease-in-out infinite}
.ava.emo-amoureux .a-head{animation:swoon 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes laugh{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-2.5px) rotate(2deg)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}72%{transform:translateY(-6px) scale(1.03)}}
@keyframes doze{0%,100%{transform:rotate(-6deg) translateY(1px)}50%{transform:rotate(-1deg)}}
@keyframes tilt{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(-2.5deg)}}
@keyframes nod{0%,100%{transform:translateY(0) rotate(1deg)}50%{transform:translateY(1.5px) rotate(-1deg)}}
@keyframes huff{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg) translateX(-1px)}}
@keyframes swoon{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-1.5px)}}
@keyframes balloon{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-2px)}}
@keyframes floaty{0%{transform:translateY(4px) scale(.8);opacity:0}30%{opacity:1}100%{transform:translateY(-12px) scale(1.1);opacity:0}}
@keyframes zz{0%{transform:translate(0,4px);opacity:0}40%{opacity:1}100%{transform:translate(6px,-10px);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.55) rotate(0);opacity:.5}50%{transform:scale(1.15) rotate(40deg);opacity:1}}
@keyframes steam{0%{transform:translateY(2px);opacity:0}50%{opacity:.9}100%{transform:translateY(-6px);opacity:0}}
.still .ava *{animation:none!important}

/* Family strip */
.fam-row{display:flex;gap:12px;overflow-x:auto;padding:8px 4px 14px;scrollbar-width:thin}
.fam{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;min-width:78px;font-weight:900;font-size:13px;color:#fff}
.fam .ring{padding:4px;border-radius:50%;border:3px solid transparent;transition:transform .25s cubic-bezier(.2,1.6,.4,1),border-color .2s}
.fam:hover .ring{transform:translateY(-3px) rotate(-4deg)}
.fam.on .ring{border-color:#fff;transform:translateY(-3px)}
.fam{position:relative}
.fname{opacity:.9;border-radius:999px;padding:0 8px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fam.on .fname{opacity:1;background:#fff;color:var(--brand-deep)}
/* story ring on avatars */
.ring.st-new{border-color:transparent;background:conic-gradient(from 200deg,#FFE08A,#FFB627,#fff,#C9A7FF,#FFE08A) border-box}
.fam.on .ring.st-new{border-color:#fff}
.ring.st-seen{background:rgba(255,255,255,.4)}
.fam .splus{position:absolute;left:54px;top:52px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--brand-deep);display:grid;place-items:center;font-weight:900;font-size:16px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:2}
.fam .you{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;background:var(--sun);color:#2B1430;border-radius:999px;padding:0 7px;margin-top:-15px;position:relative}
.add-ring{width:74px;height:74px;border-radius:50%;border:3px dashed rgba(255,255,255,.6);display:grid;place-items:center;font-size:30px;font-weight:900;transition:border-color .2s,transform .25s}
.fam:hover .add-ring{border-color:#fff;transform:rotate(90deg)}

/* Banner */
.banner{margin-top:18px}
.banner-in{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:2px dashed var(--sun);border-radius:18px;padding:12px 16px}
.banner p{margin:0;font-weight:600;font-size:14px;max-width:66ch}
.banner b{font-weight:900}
.banner-actions{display:flex;gap:8px;flex-wrap:wrap}

/* List header */
main{padding-block:20px 64px}
.list-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.list-head .av.lg{box-shadow:0 10px 24px -12px rgba(120,20,60,.55)}
.lh-text{flex:1;min-width:0}
.lh-text h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0;text-wrap:balance}
.lh-text p{margin:6px 0 0;color:var(--ink-2);font-weight:700}
.lh-actions{display:flex;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--brand);color:var(--on-brand);font-weight:900;padding:11px 20px;box-shadow:0 4px 0 var(--brand-deep);transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--brand-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
.btn.ghost:hover,.btn.ghost:active{box-shadow:0 0 0 2px var(--brand) inset;transform:none}
.btn.small{padding:7px 14px;font-size:13px}
.btn.danger{background:none;color:var(--brand);box-shadow:none;padding-inline:8px}
.btn.danger.armed{background:var(--brand);color:var(--on-brand);padding-inline:16px}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{position:relative;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;animation:rise .55s cubic-bezier(.2,1.3,.4,1) backwards;animation-delay:calc(var(--i,0) * 55ms);transition:transform .25s cubic-bezier(.2,1.5,.4,1)}
.card.settled{animation:none}
.card:hover{transform:translateY(-4px) rotate(-.4deg)}
@keyframes rise{from{transform:translateY(18px) scale(.96)}}
.thumb{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb img.remote,.it-thumb img.remote,.p-thumb img.remote{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:6%}
.loading{position:absolute;left:8px;right:8px;bottom:8px;text-align:center;background:var(--ink);color:var(--bg);font-size:11px;font-weight:900;border-radius:999px;padding:3px 8px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.gen{position:absolute;inset:0;background:radial-gradient(circle at 18% 24%,rgba(255,255,255,.45) 0 6px,transparent 7px),radial-gradient(circle at 82% 70%,rgba(255,255,255,.35) 0 9px,transparent 10px),radial-gradient(circle at 70% 18%,rgba(255,255,255,.3) 0 4px,transparent 5px),linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center}
.gen span{font-family:var(--f-display);font-size:78px;color:#fff;line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.14);transform:rotate(-6deg)}
.domain{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--ink);font-size:11px;font-weight:900;border-radius:999px;padding:3px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12);max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ribbon{position:absolute;top:20px;right:-46px;width:170px;transform:rotate(40deg);background:var(--sun);color:#2B1430;text-align:center;font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;padding:4px 0;box-shadow:0 3px 8px rgba(0,0,0,.18);animation:ribbon .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes ribbon{from{transform:rotate(40deg) translateX(60px)}}
.c-body{padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.price{font-weight:900;font-variant-numeric:tabular-nums;color:var(--brand)}
.c-body h3{margin:0;font-size:17px;line-height:1.25;font-weight:900;overflow-wrap:anywhere}
.c-note{margin:0;color:var(--ink-2);font-size:14px;overflow-wrap:anywhere}
.c-actions{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.c-link{font-weight:800;font-size:13px;color:var(--sky);text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:auto}
.c-link:hover{text-decoration:underline}
.icon-btn{background:none;border:0;color:var(--ink-2);font-weight:800;font-size:13px;padding:4px 8px;border-radius:10px}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.got{color:var(--mint)}
.c-actions .icon-btn:first-child{margin-left:auto}
.c-link + .icon-btn{margin-left:0}

.reserve{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:2px dashed var(--line);background:none;padding:12px 16px;font-weight:900;text-align:left;transition:background .2s}
.reserve:hover:not(:disabled){background:var(--surface-2)}
.reserve:disabled{cursor:default;color:var(--ink-2);font-weight:700}
.box{width:28px;height:28px;border-radius:10px;border:2.5px solid var(--ink-2);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s}
.box svg{width:18px;height:18px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24}
.mine .box{background:var(--mint);border-color:var(--mint);animation:boing .5s cubic-bezier(.2,1.8,.4,1)}
.mine .box svg{stroke-dashoffset:0;transition:stroke-dashoffset .35s .1s ease-out}
.mine .reserve{color:var(--mint)}
@keyframes boing{0%{transform:scale(.6)}60%{transform:scale(1.18) rotate(-8deg)}100%{transform:scale(1)}}
.taken .thumb{filter:saturate(.35) opacity(.75)}
.taken h3{color:var(--ink-2)}

.notices{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.notice{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--sun);border-radius:18px;padding:12px 14px;flex-wrap:wrap}
.notice p{margin:0;flex:1;min-width:220px;font-weight:600;font-size:14px}
.notice b{font-weight:900}

.empty{background:var(--surface);border:2px dashed var(--line);border-radius:24px;padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0}
.empty p{margin:0;color:var(--ink-2);font-weight:600;max-width:46ch}
.gift{width:84px;height:84px;animation:giftbob 3.5s ease-in-out infinite}
@keyframes giftbob{50%{transform:translateY(-6px) rotate(3deg)}}

/* Modal */
.modal{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.panel{background:var(--surface);border-radius:28px;width:100%;max-width:700px;max-height:100%;overflow:auto;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92) translateY(10px)}}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0 0 14px;line-height:1.1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.glabel{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2)}
input[type=text],input[type=url],textarea{width:100%;background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:11px 14px;font:inherit;font-weight:700;color:var(--ink)}
textarea{resize:vertical;min-height:70px;font-weight:600}
input:focus,textarea:focus{outline:none;border-color:var(--brand)}
.hint{font-size:12.5px;color:var(--ink-2);margin:0;line-height:1.4}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:7px 16px;font-weight:900;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.it-grid{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:start}
.it-thumb{border-radius:20px;overflow:hidden;position:relative;aspect-ratio:4/3;max-width:100%;background:var(--surface-2)}
.it-thumb .gen span{font-size:56px}
.it-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.filebtn{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--sky);cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.filebtn:focus-within{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
.linkbtn{background:none;border:0;color:var(--ink-2);font-weight:800;font-size:13px;padding:0;text-decoration:underline;align-self:flex-start}
.m-foot{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.m-foot .sp{flex:1}
.intro{margin:-6px 0 16px;max-width:62ch;font-size:13.5px}
.fam-intro{display:flex;flex-direction:column;gap:14px;align-items:flex-start;max-width:460px;margin:0 auto}
.fam-intro h2{margin:0}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.who-tile{display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 8px;font-weight:900;font-size:14px;text-align:center;transition:transform .2s cubic-bezier(.2,1.6,.4,1),border-color .2s}
.who-tile:hover{border-color:var(--brand);transform:translateY(-3px)}
.add-ring.dark{width:66px;height:66px;border-color:var(--line);color:var(--ink-2)}
.pin-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;max-width:340px;margin:0 auto}
.pin-wrap h2{margin:6px 0 0}
.pin-wrap .hint{max-width:34ch}
.dots{display:flex;gap:12px;margin:10px 0 2px}
.dots span{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink-2);transition:transform .15s cubic-bezier(.2,1.8,.4,1),background .15s,border-color .15s}
.dots span.on{background:var(--brand);border-color:var(--brand);transform:scale(1.15)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-msg{min-height:21px;margin:0;color:var(--brand);font-weight:800;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.pad button{height:62px;border-radius:20px;border:0;background:var(--surface-2);font-size:24px;font-weight:900;color:var(--ink);transition:transform .1s}
.pad button:active{transform:scale(.9)}
.pad button.txt{font-size:14px;background:none;color:var(--ink-2)}
.pad button.txt:empty{visibility:hidden}
.check{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--brand)}

.pf{display:flex;gap:20px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.pf-side{display:flex;flex-direction:column;align-items:center;gap:10px}
.pf-preview .av{width:132px;height:132px;box-shadow:0 12px 28px -14px rgba(120,20,60,.6)}
.pf-fields{flex:1;min-width:220px;display:flex;flex-direction:column;gap:12px}
.pf-fields .seg{margin:0;align-self:flex-start}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tabs button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 14px;min-height:42px;font-weight:900;font-size:14px;color:var(--ink-2);box-shadow:0 2px 0 var(--line)}
.tabs button:hover{border-color:var(--ink-2);color:var(--ink)}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 0 var(--brand-deep)}
.groups{display:flex;flex-direction:column;gap:16px}
.group{display:flex;flex-direction:column;gap:8px}
.now{font-size:13px;font-weight:800;color:var(--ink-2)} .now b{color:var(--brand)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);padding:0;transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 3px var(--brand);transform:scale(1.1)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:8px 6px 8px;font-weight:800;font-size:12px;line-height:1.2;text-align:center;color:var(--ink-2);transition:transform .2s cubic-bezier(.2,1.6,.4,1),border-color .2s}
.tile:hover{transform:translateY(-2px);border-color:var(--ink-2)}
.tile.on{border-color:var(--brand);color:var(--ink);background:var(--surface-2)}
.tile .av{width:60px;height:60px}
.tile .tg{position:absolute;top:-8px;right:-4px;font-size:9.5px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:1px 7px;border:1.5px solid var(--line)}
.tile .tg.hot{background:var(--sun);color:#2B1430;border-color:var(--sun)}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:20px;padding:22px;text-align:center;font-weight:700;color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;padding:11px 20px;border-radius:999px;z-index:60;box-shadow:var(--shadow);animation:toast .35s cubic-bezier(.2,1.5,.4,1);max-width:calc(100% - 32px);display:flex;gap:14px;align-items:center}
.toast button{background:none;border:0;color:var(--brand);font-weight:900;padding:0}
@keyframes toast{from{transform:translateX(-50%) translateY(20px)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
/* Group gifts */
.gang{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.card .gang{margin:0;border-radius:0;border-top:2px dashed var(--line)}
.g-avs{display:flex;flex:none}
.g-avs .av{border:2px solid var(--surface);margin-left:-7px}
.g-avs .av:first-child{margin-left:0}
.g-more{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:10px;font-weight:900;margin-left:-7px}
.g-txt{flex:1 1 150px;min-width:0;font-size:13px;line-height:1.35;color:var(--ink-2)}
.g-txt b{color:var(--ink);font-weight:900}
.mbtn.join{flex:1 0 140px;border-color:var(--grape);color:var(--grape)}
.mbtn.join.on{background:var(--grape);color:#fff}
.reserve.armed{color:var(--brand)}
/* Card footers: big, separated buttons that are hard to tap by mistake */
.bi{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.c-foot{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:10px}
.site-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:2px solid var(--sky);color:var(--sky);background:var(--surface);border-radius:14px;font-weight:900;font-size:14px;text-decoration:none;padding:8px 12px;min-width:0;transition:background .15s,color .15s}
.site-btn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-btn:hover{background:var(--sky);color:#fff}
.manage{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border:2px solid var(--line);background:var(--surface);border-radius:14px;font:inherit;font-weight:900;font-size:14px;color:var(--ink);padding:8px 10px;cursor:pointer;transition:border-color .15s,background .15s}
.mbtn:hover{border-color:var(--ink-2)}
.mbtn.got{border-color:var(--mint);color:var(--mint)}
.mbtn.got:hover{background:var(--mint);color:#fff}
.mbtn.del{color:var(--brand)}
.mbtn.armed{background:var(--brand);border-color:var(--brand);color:#fff}
.mbtn.small{min-height:40px;font-size:13px;padding:6px 8px;text-align:center}
.prop .site-btn{margin-top:6px}
.prop .manage{margin-top:8px}
.p-actions{margin-top:8px}
/* Photo choice */
.photo-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick-btn{position:absolute;left:8px;right:8px;bottom:8px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:900;font-size:12.5px;padding:8px 10px;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.pk{position:relative;aspect-ratio:1;border:3px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;padding:0;cursor:pointer}
.pk img{width:100%;height:100%;object-fit:contain;padding:6%}
.pk.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand)}
.pk.icon .gen{position:absolute;inset:0}
.pk.icon > span{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-weight:900;font-size:12px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4)}
/* Product icons */
.gen span.ico{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:76px;transform:none;text-shadow:0 8px 14px rgba(0,0,0,.2)}
.it-thumb .gen span.ico{font-size:58px}
.p-thumb .gen span.ico{font-size:46px}
.pk .gen span.ico{font-size:46px}
@media (max-width:560px){
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .tabs button{padding:9px 4px;font-size:13px}
}

.vh{position:absolute;width:1px;height:1px;opacity:0}
.list-head .lh-text{flex:1 1 260px}
.head-av{position:relative;flex:none}
.h-ring{display:block;padding:4px;border-radius:50%;border:0;background:none;line-height:0}
.h-ring.st-new{background:conic-gradient(from 200deg,#FFE08A,#FFB627,var(--brand),#8E5BFF,#FFE08A)}
.h-ring.st-seen{background:var(--line)}
button.h-ring{cursor:pointer}
.splus.big{position:absolute;right:0;bottom:2px;width:30px;height:30px;border-radius:50%;border:3px solid var(--bg);background:var(--brand);color:#fff;font-weight:900;font-size:18px;line-height:1;display:grid;place-items:center;padding:0;box-shadow:0 3px 8px rgba(120,20,60,.3)}
.idea-card{border:2px dashed var(--line);box-shadow:none}
.idea-card .vis{background:var(--grape);color:#fff}
.idea-go{display:grid;grid-template-columns:1fr 1fr;border-top:2px dashed var(--line)}
.idea-go button{border:0;background:none;padding:12px 8px;font-weight:900;font-size:13px;color:var(--ink-2)}
.idea-go button:hover{background:var(--surface-2);color:var(--ink)}
.idea-go button.main{color:var(--mint);border-left:2px dashed var(--line)}
.seg.dest{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-radius:18px;margin-bottom:2px}
.seg.dest button{display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:14px;padding:8px 6px;line-height:1.2;white-space:normal}
@media (max-width:560px){
  .list-head{gap:12px}
  .list-head .av.lg{width:68px;height:68px}
  .list-head .lh-text{flex:1 1 180px}
  .lh-actions{width:100%}
  .lh-actions .btn{flex:1;justify-content:center}
  .ptabs button{padding:7px 4px;font-size:12.5px;gap:4px}
  .ptabs button .long{display:none}
  .ptabs button .short{display:inline}
  .ptabs button .lk{display:none}
  .top-row{flex-wrap:nowrap}
  .brand .tag{display:none}
  .ptabs button b{padding:1px 5px;min-width:18px}
  .fam .splus{left:50px;top:48px}
}
.lk{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Stories row (in the pink band) */
.story-row{display:flex;gap:14px;overflow-x:auto;padding:4px 4px 2px;scrollbar-width:none}
.story-row::-webkit-scrollbar{display:none}
.story{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;color:#fff;font-weight:800;font-size:11.5px;min-width:60px}
.sring{padding:3px;border-radius:50%;background:rgba(255,255,255,.35);transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
.story:hover .sring{transform:scale(1.06)}
.story.new .sring{background:conic-gradient(from 200deg,#FFE08A,#FFB627,#fff,#8E5BFF,#FFE08A);animation:spinring 6s linear infinite}
@keyframes spinring{to{filter:hue-rotate(40deg)}}
.story.add .sring{background:none;border:2px dashed rgba(255,255,255,.7);padding:2px}
.av.st{width:48px;height:48px;border:2.5px solid var(--brand)}
.splus{position:absolute;right:2px;top:34px;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--brand-deep);display:grid;place-items:center;font-weight:900;font-size:15px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sname{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.95}

/* Story viewer */
.storyview{position:fixed;inset:0;z-index:65;background:#140810;display:grid;place-items:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);animation:fadein .2s ease-out}
@keyframes fadein{from{opacity:0}}
.sv-frame{position:relative;width:min(100%,460px);height:min(100%,820px);background:#000;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.sv-img{width:100%;height:100%;object-fit:contain}
.sv-bars{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:4px;z-index:3}
.sv-bars span{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.sv-bars i{display:block;height:100%;width:0;background:#fff}
.sv-bars .done i{width:100%}
.sv-bars .run i{animation:fillbar 5.5s linear forwards}
@keyframes fillbar{to{width:100%}}
.sv-head{position:absolute;left:10px;right:10px;top:22px;display:flex;align-items:center;gap:8px;color:#fff;z-index:4;font-size:13px}
.sv-head span{opacity:.8}
.sv-head .sp{flex:1}
.sv-btn,.sv-x{background:rgba(0,0,0,.35);border:0;color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12.5px}
.sv-btn.armed{background:var(--brand)}
.sv-x{width:34px;height:34px;padding:0;font-size:16px}
#pparents .field.parents{margin-top:22px;padding-top:16px;border-top:1.5px dashed var(--line, rgba(0,0,0,.08))}
#pparents .people{margin-top:10px}
.sv-frame{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.sv-frame.paused .sv-bars .run i{animation-play-state:paused}
.sv-nav{position:absolute;top:70px;bottom:0;width:35%;background:none;border:0;z-index:2;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sv-nav.prev{left:0}.sv-nav.next{right:0;width:65%}
/* Bottom of a story: caption, messages on the photo, and the reply bar */
.sv-bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;gap:8px;padding:60px 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,.35) 60%,transparent);pointer-events:none}
.sv-cap{margin:0 2px;color:#fff;font-weight:800;font-size:17px;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.sv-cms{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-height:min(34vh,260px);overflow-y:auto;overscroll-behavior:contain;pointer-events:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 22px);mask-image:linear-gradient(to bottom,transparent,#000 22px);padding-top:16px}
.sv-cms::-webkit-scrollbar{display:none}
.sv-cms.empty{display:none}
.sv-cm{display:flex;align-items:center;gap:7px;max-width:88%;background:rgba(20,8,16,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;border-radius:18px;padding:5px 8px 5px 5px;font-size:14.5px;line-height:1.3;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.sv-cm .av{flex:none;border:1.5px solid #fff}
.sv-cm span{overflow-wrap:anywhere}
.sv-cm b{font-weight:900;color:#FFC2D3;margin-right:2px}
.sv-cm.emo span{font-size:15px}
.sv-cm.pop{animation:cmpop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes cmpop{from{transform:translateY(12px) scale(.85);opacity:0}}
.sv-cdel{flex:none;width:22px;height:22px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:11px;font-weight:900;padding:0;margin-left:2px;cursor:pointer}
.sv-reply{display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.sv-emo{display:flex;justify-content:space-between;gap:4px}
.sv-emo button{flex:1;min-width:0;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.14);font-size:24px;line-height:1;cursor:pointer;transition:background .15s}
.sv-emo button:hover{background:rgba(255,255,255,.26)}
.sv-emo button.bump{animation:bump .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{40%{transform:scale(1.35)}}
.sv-form{display:flex;gap:8px}
.sv-form input{flex:1;min-width:0;height:46px;border-radius:999px;border:1.5px solid rgba(255,255,255,.55);background:rgba(0,0,0,.3);color:#fff;padding:0 18px;font:inherit;font-size:16px;outline:none}
.sv-form input::placeholder{color:rgba(255,255,255,.75)}
.sv-form input:focus{border-color:#fff;background:rgba(0,0,0,.5)}
.sv-form button{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:18px;cursor:pointer;box-shadow:0 4px 14px rgba(255,61,110,.45)}
.sv-fly{position:absolute;z-index:6;font-size:34px;pointer-events:none;transform:translate(-50%,0);animation:svfly 1.7s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes svfly{0%{opacity:0;transform:translate(-50%,0) scale(.4)}12%{opacity:1;transform:translate(-50%,-30px) scale(var(--s))}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-380px) scale(var(--s)) rotate(12deg)}}
.sc{border-radius:20px;overflow:hidden;background:var(--surface-2);max-height:52vh;display:flex;justify-content:center;margin-bottom:10px}
.sc-img{max-height:52vh;width:auto;max-width:100%;display:block}
.sc-drop{cursor:pointer}

/* Tabs on someone else's page */
.ptabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:-4px 0 18px;padding:4px;background:var(--surface-2);border-radius:999px;max-width:600px}
.ptabs button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;border-radius:999px;padding:8px 6px;font-weight:900;font-size:13.5px;color:var(--ink-2);white-space:nowrap;min-width:0}
.ptabs button span{overflow:hidden;text-overflow:ellipsis}
.ptabs .short{display:none}
.ptabs button b{font-size:11px;background:var(--surface);color:var(--ink-2);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.ptabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(120,20,60,.15)}
.ptabs button.on b{background:var(--brand);color:#fff}
.secret{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:0 0 16px;font-size:14px;font-weight:600;color:var(--ink-2);max-width:760px}
.secret .lk{margin-top:3px;color:var(--brand)}
.secret b{color:var(--ink);font-weight:900}
h2.sec{font-family:var(--f-display);font-weight:400;font-size:22px;margin:22px 0 10px}

/* Proposals */
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.prop{display:flex;gap:14px;background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow);min-width:0}
.prop.decided{outline:2.5px solid var(--mint);outline-offset:-2.5px}
.p-thumb{position:relative;width:92px;height:92px;flex:none;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.p-thumb img{width:100%;height:100%;object-fit:cover}
.p-thumb .gen span{font-size:42px}
.p-body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.p-who{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink-2)}
.prop.decided .p-who{color:var(--mint)}
.p-body h3{margin:0;font-size:16px;font-weight:900;line-height:1.25;overflow-wrap:anywhere}
.p-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.p-actions .c-link{margin-right:4px}
.p-actions .sp{flex:1}
.vote{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;min-height:40px;font-weight:900;font-size:13px;color:var(--ink-2);transition:transform .15s cubic-bezier(.2,1.8,.4,1)}
.vote svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.vote:active{transform:scale(.9)}
.vote.on{border-color:var(--mint);color:var(--mint);background:var(--surface-2)}
.vote.down.on{border-color:var(--brand);color:var(--brand)}
.icon-btn.armed{background:var(--brand);color:#fff}

/* Private ideas */
.quick{display:flex;gap:10px;margin-bottom:16px;max-width:760px}

// Seasonal moments for today's date
function momentsFor(date) {
  const m = date.getMonth() + 1, d = date.getDate(), md = m * 100 + d, t = [];
  if ((m === 10 && d >= 10) || (m === 11 && d <= 2)) t.push('halloween');
  if (m === 12 || (m === 1 && d <= 6)) t.push('noel');
  if (md >= 320 && md <= 620) t.push('printemps');
  else if (md >= 621 && md <= 922) t.push('ete');
  else if (md >= 923 && md <= 1220) t.push('automne');
  else t.push('hiver');
  return t;
}

// S mirrors the family data, kept up to date in real time by the backend
const S = { me: null, profiles: [], items: [], res: {}, proposals: [], ideas: [], stories: [], comments: [], tab: 'wishes', selected: DEV.selected || null, locks: DEV.locks || {} };
function save() { DEV.selected = S.selected; DEV.locks = S.locks; saveDevice(); }
const prof = id => S.profiles.find(p => p.id === id);
const viewer = () => prof(S.me);
const selected = () => prof(S.selected) || viewer() || S.profiles[0];
// A child account: a relative without the app whose list only their parents look after
const parentsOf = p => (p && p.managed && Array.isArray(p.parents)) ? p.parents : [];
const isParentOf = p => parentsOf(p).includes(S.me);
// The surprise is kept from the list owner, and from the parents of a child
const keptSecret = p => !!p && (p.id === S.me || isParentOf(p));
// I can manage my own list, my children's lists, and the lists of relatives the whole family looks after
const canManage = owner => !!owner && (owner.id === S.me || (!!owner.managed && (!parentsOf(owner).length || isParentOf(owner))));

  return n.length > 1 ? n.slice(0, -1).join(', ') + ' et ' + n[n.length - 1] : n[0] || '';
};
const ofName = n => (/^[aeiouyàâäéèêëîïôöûüh]/i.test(n) ? "d'" : 'de ') + n;
const STORY_LIFE = 48 * 3600 * 1000;

// ================= Backend =================
// The 6-digit code is combined with the family code; the result is only ever sent to Firebase, never stored
const passwordFor = (code, pin) => `kdo:${code}:${pin}`;
async function familyIdFor(code) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kdo-family|' + code));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
}
const clean = o => JSON.parse(JSON.stringify(o));

async function createFirebaseBackend() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
  const [{ initializeApp }, A, F] = await Promise.all([
    import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`), import(`${base}/firebase-firestore.js`),
  ]);
  const app = initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app);
  let db;
  try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch (e) { db = F.getFirestore(app); }
  const famDoc = fid => F.doc(db, 'families', fid);
  const col = (fid, name) => F.collection(db, 'families', fid, name);
  const ref = (fid, name, id) => F.doc(col(fid, name), id);
  const emailOf = p => `${p.login}@${LOGIN_DOMAIN}`;
  const authError = e => {
    const c = String(e?.code || e?.message || '');
    if (c.includes('too-many-requests')) return 'too-many';
    if (/invalid-credential|wrong-password|user-not-found|invalid-login|invalid-password/.test(c)) return 'wrong';
    if (c.includes('network')) return 'offline';
    return 'error';
  };
  const rows = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  return {
    async familyExists(fid) { return (await F.getDoc(famDoc(fid))).exists(); },
    async listProfiles(fid) { return rows(await F.getDocs(col(fid, 'profiles'))); },
    waitForAuth() { return new Promise(res => { const off = A.onAuthStateChanged(auth, u => { off(); res(u ? u.uid : null); }); }); },
    async signUp({ fid, code, pin, profile, newFamily }) {
      const login = uid() + uid() + uid();
      let me;
      try { me = (await A.createUserWithEmailAndPassword(auth, `${login}@${LOGIN_DOMAIN}`, passwordFor(code, pin))).user.uid; }
      catch (e) { throw new Error(authError(e)); }
      if (newFamily) {
        try { await F.setDoc(famDoc(fid), { createdAt: Date.now(), createdBy: me }); }
        catch (e) { if (!(await this.familyExists(fid))) throw e; }
      }
      await F.setDoc(ref(fid, 'profiles', me), clean({ name: profile.name, avatar: profile.avatar, photo: profile.photo || null, managed: false, login, createdAt: Date.now() }));
      return me;
    },
    async signIn({ profile, code, pin }) {
      try { return (await A.signInWithEmailAndPassword(auth, emailOf(profile), passwordFor(code, pin))).user.uid; }
      catch (e) { throw new Error(authError(e)); }
    },
    async signOut() { await A.signOut(auth); },
    async checkPin({ code, profile, pin }) {
      try { await A.reauthenticateWithCredential(auth.currentUser, A.EmailAuthProvider.credential(emailOf(profile), passwordFor(code, pin))); }
      catch (e) { throw new Error(authError(e)); }
    },
    async changePin({ code, newPin }) { await A.updatePassword(auth.currentUser, passwordFor(code, newPin)); },
    subscribe(fid, me, on) {
      const offs = [], perPerson = new Map();
      // Each query only asks for what the rules allow me to see, so nothing hidden is ever sent to me
      const itemSets = { everyone: [], shared: [], mine: [] };
      const pushItems = () => { const m = new Map(); Object.values(itemSets).flat().forEach(i => m.set(i.id, i)); on.items([...m.values()]); };
      const q = (name, ...w) => F.query(col(fid, name), ...w);
      // One listener per person, except me and the children I'm a parent of: those surprises are never sent to me
      const quiet = e => console.error(e);
      const track = p => {
        const pid = p.id, hidden = pid === me || (p.managed && (p.parents || []).includes(me));
        if (hidden) {
          if (perPerson.has(pid)) { perPerson.get(pid).forEach(f => f()); perPerson.delete(pid); on.reservations(pid, []); on.proposals(pid, []); }
          return;
        }
        if (perPerson.has(pid)) return;
        perPerson.set(pid, [
          F.onSnapshot(q('reservations', F.where('ownerId', '==', pid)), s => on.reservations(pid, rows(s)), quiet),
          F.onSnapshot(q('proposals', F.where('forId', '==', pid)), s => on.proposals(pid, rows(s)), quiet),
        ]);
      };
      offs.push(F.onSnapshot(col(fid, 'profiles'), s => { const list = rows(s); list.forEach(track); on.profiles(list); }, on.error));
      offs.push(F.onSnapshot(q('items', F.where('everyone', '==', true)), s => { itemSets.everyone = rows(s); pushItems(); }, on.error));
      offs.push(F.onSnapshot(q('items', F.where('visibleTo', 'array-contains', me)), s => { itemSets.shared = rows(s); pushItems(); }, on.error));
      offs.push(F.onSnapshot(q('items', F.where('ownerId', '==', me)), s => { itemSets.mine = rows(s); pushItems(); }, on.error));
      offs.push(F.onSnapshot(q('ideas', F.where('by', '==', me)), s => on.ideas(rows(s)), on.error));
      offs.push(F.onSnapshot(col(fid, 'stories'), s => on.stories(rows(s)), on.error));
      offs.push(F.onSnapshot(col(fid, 'storyComments'), s => on.storyComments(rows(s)), on.error));
      return () => { offs.forEach(f => f()); perPerson.forEach(list => list.forEach(f => f())); };
    },
    async addProfile(fid, data) { const r = await F.addDoc(col(fid, 'profiles'), clean(data)); return r.id; },
    updateProfile: (fid, id, data) => F.updateDoc(ref(fid, 'profiles', id), clean(data)),
    async deleteProfile(fid, id, itemIds) {
      const b = F.writeBatch(db);
      itemIds.forEach(i => b.delete(ref(fid, 'items', i)));
      b.delete(ref(fid, 'profiles', id));
      await b.commit();
    },
    async addItem(fid, data) { const r = await F.addDoc(col(fid, 'items'), clean(data)); return r.id; },
    updateItem: (fid, id, data) => F.updateDoc(ref(fid, 'items', id), clean(data)),
    // Creating the reservation fails if someone already holds it (the rules forbid overwriting)
    async reserve(fid, item, me) {
      try { await F.setDoc(ref(fid, 'reservations', item.id), { ownerId: item.ownerId, by: me, at: Date.now() }); }
      catch (e) { throw new Error('already'); }
    },
    release: (fid, itemId) => F.deleteDoc(ref(fid, 'reservations', itemId)),
    // Group gifts: each person can only add or remove themselves
    joinReservation: (fid, itemId, me, on) => F.updateDoc(ref(fid, 'reservations', itemId), { [`joiners.${me}`]: on ? true : F.deleteField() }),
    joinProposal: (fid, id, me, on) => F.updateDoc(ref(fid, 'proposals', id), { [`joiners.${me}`]: on ? true : F.deleteField() }),
    async addProposal(fid, data) { const r = await F.addDoc(col(fid, 'proposals'), clean(data)); return r.id; },
    updateProposal: (fid, id, data) => F.updateDoc(ref(fid, 'proposals', id), clean(data)),
    vote: (fid, id, me, value) => F.updateDoc(ref(fid, 'proposals', id), { [`votes.${me}`]: value ? value : F.deleteField() }),
    deleteProposal: (fid, id) => F.deleteDoc(ref(fid, 'proposals', id)),
    async addIdea(fid, data) { const r = await F.addDoc(col(fid, 'ideas'), clean(data)); return r.id; },
    updateIdea: (fid, id, data) => F.updateDoc(ref(fid, 'ideas', id), clean(data)),
    deleteIdea: (fid, id) => F.deleteDoc(ref(fid, 'ideas', id)),
    async addStory(fid, data) { const r = await F.addDoc(col(fid, 'stories'), clean(data)); return r.id; },
    // A story leaves with its comments, in one go
    async deleteStory(fid, id, commentIds = []) {
      const b = F.writeBatch(db);
      commentIds.forEach(c => b.delete(ref(fid, 'storyComments', c)));
      b.delete(ref(fid, 'stories', id));
      await b.commit();
    },
    async addStoryComment(fid, data) { const r = await F.addDoc(col(fid, 'storyComments'), clean(data)); return r.id; },
    deleteStoryComment: (fid, id) => F.deleteDoc(ref(fid, 'storyComments', id)),
  };
}

// Local fake backend that applies the same rules as the server. Used for testing only.
function createMockBackend() {
  const KEY = 'kdo-mock-db';
  let D = null;
  try { D = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  D = D || {};
  for (const k of ['families', 'profiles', 'items', 'reservations', 'proposals', 'ideas', 'stories', 'storyComments', 'users', 'fails']) D[k] = D[k] || {};
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {} };
  const subs = new Set();
  const tick = () => new Promise(r => setTimeout(r, 5));
  const deny = () => { throw new Error('permission-denied'); };
  const bag = (kind, fid) => (D[kind][fid] = D[kind][fid] || {});
  const all = (kind, fid) => Object.values(bag(kind, fid)).map(x => JSON.parse(JSON.stringify(x)));
  const member = (fid, me) => !!bag('profiles', fid)[me] && !bag('profiles', fid)[me].managed;
  const parentsIn = (fid, pid) => { const p = bag('profiles', fid)[pid]; return p && p.managed ? (p.parents || []) : []; };
  const manages = (fid, me, ownerId) => ownerId === me || (!!bag('profiles', fid)[ownerId]?.managed && (!parentsIn(fid, ownerId).length || parentsIn(fid, ownerId).includes(me)));
  const secretFrom = (fid, me, ownerId) => ownerId === me || parentsIn(fid, ownerId).includes(me);
  const canSee = (it, me) => it.ownerId === me || it.everyone === true || (it.visibleTo || []).includes(me);
  const emit = () => { persist(); subs.forEach(f => f()); };
  const nid = () => uid() + uid();
  const me = () => D.session;
  // Same as the rules: my own comment, an expired one, one whose story is gone, or one on my story
  const canDropComment = (fid, c) => {
    if (!c) return false;
    const s = bag('stories', fid)[c.storyId];
    return c.by === me() || c.expiresAt < Date.now() || !s || s.by === me();
  };
  const put = (kind, fid, data) => { const id = nid(); bag(kind, fid)[id] = { ...clean(data), id }; emit(); return id; };
  return {
    async familyExists(fid) { await tick(); return !!D.families[fid]; },
    async listProfiles(fid) { await tick(); return all('profiles', fid); },
    async waitForAuth() { await tick(); return D.session; },
    async signUp({ fid, code, pin, profile, newFamily }) {
      await tick();
      const login = nid(), id = nid();
      if (newFamily && !D.families[fid]) D.families[fid] = { createdAt: Date.now(), createdBy: id };
      if (!D.families[fid]) deny();
      D.users[login] = { pw: passwordFor(code, pin), uid: id }; D.session = id;
      bag('profiles', fid)[id] = { id, name: profile.name, avatar: profile.avatar, photo: profile.photo || null, managed: false, login, createdAt: Date.now() };
      emit(); return id;
    },
    async signIn({ profile, code, pin }) {
      await tick();
      const u = D.users[profile.login], f = D.fails[profile.login] || 0;
      if (f >= 10) throw new Error('too-many');
      if (!u || u.pw !== passwordFor(code, pin)) { D.fails[profile.login] = f + 1; persist(); throw new Error('wrong'); }
      D.fails[profile.login] = 0; D.session = u.uid; persist(); return u.uid;
    },
    async signOut() { await tick(); D.session = null; persist(); },
    async checkPin({ code, profile, pin }) { await tick(); if (D.users[profile.login]?.pw !== passwordFor(code, pin)) throw new Error('wrong'); },
    async changePin({ code, newPin }) {
      await tick();
      const u = Object.values(D.users).find(x => x.uid === D.session); if (!u) deny();
      u.pw = passwordFor(code, newPin); persist();
    },
    subscribe(fid, uidMe, on) {
      const f = () => {
        if (D.session !== uidMe) return;
        const people = all('profiles', fid);
        on.profiles(people);
        // Same as the server rules: hidden items, my own reservations and proposals for me are never sent
        on.items(all('items', fid).filter(i => canSee(i, uidMe)));
        people.forEach(p => {
          if (p.id === uidMe) return;
          const hide = secretFrom(fid, uidMe, p.id);
          on.reservations(p.id, hide ? [] : all('reservations', fid).filter(r => r.ownerId === p.id));
          on.proposals(p.id, hide ? [] : all('proposals', fid).filter(r => r.forId === p.id));
        });
        on.ideas(all('ideas', fid).filter(i => i.by === uidMe));
        on.stories(all('stories', fid));
        on.storyComments(all('storyComments', fid));
      };
      subs.add(f); setTimeout(f, 0);
      return () => subs.delete(f);
    },
    async addProfile(fid, data) { await tick(); if (!member(fid, me()) || data.managed !== true) deny(); return put('profiles', fid, data); },
    async updateProfile(fid, id, data) {
      await tick(); const p = bag('profiles', fid)[id];
      if (!p || !(id === me() || (member(fid, me()) && p.managed))) deny();
      if ('managed' in data || 'login' in data) deny();
      const was = p.parents || [];
      if (was.length && !was.includes(me())) deny();
      if ('parents' in data && (!p.managed || (was.length && !(data.parents || []).includes(me())))) deny();
      Object.assign(p, clean(data)); emit();
    },
    async deleteProfile(fid, id, itemIds) {
      await tick(); const p = bag('profiles', fid)[id];
      if (!p || !p.managed || !member(fid, me()) || ((p.parents || []).length && !p.parents.includes(me()))) deny();
      itemIds.forEach(i => delete bag('items', fid)[i]); delete bag('profiles', fid)[id]; emit();
    },
    async addItem(fid, data) { await tick(); if (!member(fid, me()) || !manages(fid, me(), data.ownerId)) deny(); return put('items', fid, data); },
    async updateItem(fid, id, data) {
      await tick(); const it = bag('items', fid)[id];
      if (!it || !member(fid, me()) || !manages(fid, me(), it.ownerId) || ('ownerId' in data && data.ownerId !== it.ownerId)) deny();
      Object.assign(it, clean(data)); emit();
    },
    async reserve(fid, item, by) {
      await tick(); const it = bag('items', fid)[item.id];
      if (!member(fid, by) || !it || secretFrom(fid, by, it.ownerId) || it.removed || !canSee(it, by)) deny();
      if (bag('reservations', fid)[item.id]) throw new Error('already');
      bag('reservations', fid)[item.id] = { id: item.id, ownerId: it.ownerId, by, at: Date.now() }; emit();
    },
    async release(fid, itemId) {
      await tick(); const r = bag('reservations', fid)[itemId];
      if (!r || r.by !== me()) deny();
      delete bag('reservations', fid)[itemId]; emit();
    },
    async addProposal(fid, data) {
      await tick();
      if (!member(fid, me()) || data.by !== me() || secretFrom(fid, me(), data.forId) || !bag('profiles', fid)[data.forId]) deny();
      return put('proposals', fid, data);
    },
    async updateProposal(fid, id, data) {
      await tick(); const p = bag('proposals', fid)[id];
      if (!p || p.by !== me() || 'by' in data || 'forId' in data) deny();
      Object.assign(p, clean(data)); emit();
    },
    async joinReservation(fid, itemId, who, on) {
      await tick(); const r = bag('reservations', fid)[itemId], it = bag('items', fid)[itemId];
      if (!r || !member(fid, who) || who !== me() || secretFrom(fid, who, r.ownerId) || r.by === who || !it || !canSee(it, who)) deny();
      r.joiners = r.joiners || {}; if (on) r.joiners[who] = true; else delete r.joiners[who]; emit();
    },
    async joinProposal(fid, id, who, on) {
      await tick(); const p = bag('proposals', fid)[id];
      if (!p || !member(fid, who) || who !== me() || secretFrom(fid, who, p.forId)) deny();
      p.joiners = p.joiners || {}; if (on) p.joiners[who] = true; else delete p.joiners[who]; emit();
    },
    async vote(fid, id, who, value) {

const firstName = n => String(n || '').trim().split(/[\s-]+/)[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]/g, '');

  for (const child of list) {

// Group gifts: the person who took it, plus everyone who joined
function splitPrice(price, n) {
  if (!price || n < 2) return '';
  const m = String(price).replace(/\s/g, '').match(/(\d+(?:[.,]\d+)?)/);
  if (!m) return '';
  const v = parseFloat(m[1].replace(',', '.')) / n;
  if (!isFinite(v) || v <= 0) return '';
  const cur = /€|eur/i.test(price) ? ' €' : /\$/.test(price) ? ' $' : /£/.test(price) ? ' £' : '';
  return String(v >= 10 ? Math.round(v) : Math.round(v * 10) / 10).replace('.', ',') + cur;
}
function gangHTML({ leadId, joiners, price, act, id }) {
  const ids = [leadId, ...Object.keys(joiners || {}).filter(k => joiners[k] && k !== leadId)];
  const people = ids.map(prof).filter(Boolean), n = people.length;
  const meIn = ids.includes(S.me), lead = leadId === S.me;
  const share = splitPrice(price, n);
  const names = people.map(p => p.id === S.me ? 'toi' : p.name);
  const label = n > 1 ? `<b>${n} personnes sur ce cadeau</b>${share ? ` · ≈ ${esc(share)} chacun` : ''}<br><span>${esc(names.join(', '))}</span>`
    : `<b>1 personne sur ce cadeau pour l'instant</b><br><span>${lead ? 'Les autres peuvent se joindre à toi' : 'Tu peux te joindre à ' + esc(people[0]?.name || 'elle')}</span>`;
  return `<div class="gang">
    <span class="g-avs">${people.slice(0, 4).map(p => face(p, 'xs')).join('')}${n > 4 ? `<span class="g-more">+${n - 4}</span>` : ''}</span>
    <span class="g-txt">${label}</span>
    ${lead ? '' : `<button class="mbtn join ${meIn ? 'on' : ''}" data-act="${act}" data-id="${id}" aria-pressed="${meIn}">${meIn ? CHECK + 'Tu participes' : '+ Je participe'}</button>`}
  </div>`;
}

// ================= Link preview: product name and photo, read from the shop page =================
// Browsers can't read shop pages directly, so a free preview service (Microlink) reads it for us
const previewCache = new Map();
function cleanTitle(t, publisher) {
  t = (t || '').replace(/\s+/g, ' ').trim();
  if (!t) return '';
  t = t.replace(/\s*[:|–—-]\s*Amazon\.[a-z.]+.*$/i, '');
  const parts = t.split(/\s+[|–—]\s+|\s+-\s+/);
  if (parts.length > 1) {
    const last = parts[parts.length - 1], rest = parts.slice(0, -1).join(' - ');
    if (last.length <= 40 && rest.length >= 6) t = rest;
  }
  if (publisher && t.toLowerCase() === String(publisher).toLowerCase()) return '';
  if (/^(amazon|fnac|cdiscount|zalando|ikea|darty|boulanger|decathlon|leboncoin)(\.[a-z.]+)?$/i.test(t)) return '';
  if (/robot|captcha|access denied|page not found|page introuvable|\b404\b/i.test(t)) return '';
  return t.slice(0, 110);
}
// Browsers can't read shop pages directly, so a free preview service (Microlink) reads the page for us:
// its name, its main photo, and every other image on the page so the person can pick the right one.
function linkPreview(url) {
  if (!url) return Promise.resolve(null);
  if (previewCache.has(url)) return previewCache.get(url);
  const p = (async () => {
    if (MOCK) { const r = window.KDO_PREVIEW ? await window.KDO_PREVIEW(url) : null; return r && { ...r, title: cleanTitle(r.title, r.publisher) }; }
    const q = new URLSearchParams({ url, palette: 'false', audio: 'false', video: 'false', iframe: 'false' });
    // Extra rules: all <img> on the page, all og:image tags, and Amazon's big product photo
    q.set('data.imgs.selectorAll', 'img'); q.set('data.imgs.attr', 'src');
    q.set('data.lazy.selectorAll', 'img[data-src]'); q.set('data.lazy.attr', 'data-src');
    q.set('data.ogs.selectorAll', 'meta[property="og:image"]'); q.set('data.ogs.attr', 'content');
    q.set('data.hires.selector', '#landingImage'); q.set('data.hires.attr', 'data-old-hires');
    q.set('data.dyn.selector', '#landingImage'); q.set('data.dyn.attr', 'data-a-dynamic-image');
    const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 12000);
    try {
      const r = await fetch(`https://api.microlink.io/?${q}`, { signal: ctrl.signal });
      const j = await r.json();
      if (j.status !== 'success' || !j.data) return null;
      const d = j.data, list = v => Array.isArray(v) ? v : v ? [v] : [];
      let dyn = [];
      try { dyn = Object.keys(JSON.parse(d.dyn || '{}')); } catch (e) {}
      const images = [d.image?.url, d.hires, ...dyn, ...list(d.ogs), ...list(d.lazy), ...list(d.imgs)]
        .map(x => typeof x === 'object' && x ? x.url || x.src : x).filter(Boolean);
      return { title: cleanTitle(d.title, d.publisher), image: d.image?.url || '', images, base: d.url || url };
    } catch (e) { return null; }
    finally { clearTimeout(timer); }
  })();
  previewCache.set(url, p);
  return p;
}
// Amazon often blocks robots, but its product photo can be found from the product code in the link
function amazonImages(url) {
  const m = String(url).match(/amazon\.[a-z.]+\/(?:.*\/)?(?:dp|gp\/product|gp\/aw\/d|product)\/([A-Z0-9]{10})/i);
  if (!m) return [];
  const asin = m[1].toUpperCase();
  return [`https://m.media-amazon.com/images/P/${asin}.01._SCLZZZZZZZ_.jpg`, `https://images-na.ssl-images-amazon.com/images/P/${asin}.01.LZZZZZZZ.jpg`];
}
function cleanImageList(raw, base) {
  const seen = new Set(), out = [];
  for (let u of raw) {
    try { u = new URL(String(u).trim(), base).href; } catch (e) { continue; }
    u = u.replace(/^http:\/\//, 'https://');
    if (!/^https:\/\//.test(u) || /^data:/.test(u)) continue;
    if (/\.svg(\?|$)|\.gif(\?|$)|sprite|logo|icon|favicon|pixel|1x1|blank|spacer|transparent|badge|flag|rating|stars?[-_.]|avatar|banner|tracking|placeholder|loader/i.test(u)) continue;
    // Amazon thumbnails: ask for the large version instead
    if (/media-amazon\.com|ssl-images-amazon\.com/.test(u)) u = u.replace(/\._[A-Z0-9_,]+_\.(jpg|jpeg|png|webp)/i, '._AC_SL800_.$1');
    if (seen.has(u)) continue;
    seen.add(u); out.push(u);
    if (out.length >= 30) break;
  }
  return out;
}
// Keep only real product-sized photos: load each one and check its size
function probeImages(urls) {
  return Promise.all(urls.map(url => new Promise(res => {
    const img = new Image(); let done = false;
    const end = v => { if (!done) { done = true; res(v); } };
    img.referrerPolicy = 'no-referrer';
    img.onload = () => end(img.naturalWidth >= 150 && img.naturalHeight >= 150 && img.naturalWidth / img.naturalHeight < 3 && img.naturalHeight / img.naturalWidth < 3 ? { url, w: img.naturalWidth, h: img.naturalHeight } : null);
    img.onerror = () => end(null);
    setTimeout(() => end(null), 6000);
    img.src = url;
  }))).then(list => list.filter(Boolean));
}
async function findProductPhotos(url, res) {
  const raw = [...(res?.images || []), ...(res?.image ? [res.image] : []), ...amazonImages(res?.base || url), ...amazonImages(url)];
  const ok = await probeImages(cleanImageList(raw, res?.base || url));
  // Main photo first, then the biggest ones
  const main = ok.slice(0, 1), rest = ok.slice(1).sort((a, b) => b.w * b.h - a.w * a.h);
  return [...main, ...rest].slice(0, 12).map(x => x.url);
}
// Older entries saved before this existed: fetch their product photo once, in the background
let backfillBudget = 6;
function backfillImages(list, kind) {
  for (const x of list) {
    if (backfillBudget <= 0) return;
    if (!x.url || x.imageUrl || x.photo || x.removed) continue;
    const mineToEdit = kind === 'items' ? canManage(prof(x.ownerId)) : x.by === S.me;
    DEV.tried = DEV.tried || {};
    if (!mineToEdit || DEV.tried[x.id]) continue;
    DEV.tried[x.id] = 1; saveDevice(); backfillBudget--;
    linkPreview(x.url).then(res => findProductPhotos(x.url, res)).then(photos => {
      if (!photos[0]) return;
      const fn = kind === 'items' ? backend.updateItem : kind === 'proposals' ? backend.updateProposal : backend.updateIdea;
      fn(DEV.fid, x.id, { imageUrl: photos[0] }).catch(err => console.error(err));
    });
  }
}
