// ================= Image files =================
function readImage(file, max, square, quality = .82) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        let sx = 0, sy = 0, sw = img.width, sh = img.height;
        if (square) { const m = Math.min(sw, sh); sx = (sw - m) / 2; sy = (sh - m) / 2; sw = sh = m; }
        const s = Math.min(1, max / Math.max(sw, sh));
        const c = document.createElement('canvas'); c.width = Math.round(sw * s); c.height = Math.round(sh * s);
        c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// ================= Confetti =================
const cv = $('#confetti'), ctx = cv.getContext('2d');
let parts = [], running = false;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
function sizeCanvas() {
  const d = window.devicePixelRatio || 1, w = document.documentElement.clientWidth || innerWidth, ht = Math.max(innerHeight, document.documentElement.clientHeight || 0);
  cv.style.width = w + 'px'; cv.style.height = ht + 'px';
  cv.width = Math.round(w * d); cv.height = Math.round(ht * d); ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', sizeCanvas); window.visualViewport?.addEventListener('resize', sizeCanvas); sizeCanvas();
function burst(x, y, n = 80) {
  if (reduceMotion.matches) return;
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--brand', '--sun', '--mint', '--sky', '--grape'].map(v => cs.getPropertyValue(v).trim() || '#FF3D6E');
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * 12, vy: -Math.random() * 11 - 3, r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: 4 + Math.random() * 5, c: cols[i % cols.length], life: 0, round: Math.random() < .3 });
  if (!running) { running = true; requestAnimationFrame(tick); }
}
// Clear the whole canvas, edges included (iPhone's canvas can be bigger than the visible area)
function clearCanvas() { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore(); }
function tick() {
  clearCanvas();
  const W = cv.width / (window.devicePixelRatio || 1), H = cv.height / (window.devicePixelRatio || 1);
  parts = parts.filter(p => p.y < H + 60 && p.y > -400 && p.x > -60 && p.x < W + 60 && p.life < 240);
  for (const p of parts) {
    p.life++; p.vy += .3; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
    if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2.6, 0, 6.29); ctx.fill(); }
    else { const f = Math.abs(Math.cos(p.life * .18)); ctx.fillRect(-p.w / 2, -p.h * f / 2, p.w, p.h * f + .5); }
    ctx.restore();
  }
  if (parts.length) requestAnimationFrame(tick);
  else { running = false; clearCanvas(); }
}
// If the app is hidden mid-animation, drop the leftovers instead of freezing them on screen
document.addEventListener('visibilitychange', () => { if (document.hidden) { parts = []; clearCanvas(); } });

// ================= Events =================
document.addEventListener('click', e => {
  if (e.target === $('#modal')) { closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  switch (act) {
    case 'me': openProfile('edit', S.me); break;
    case 'select': {
      if (S.selected !== id) S.tab = 'wishes';
      S.selected = id; save(); render();
      // Like Instagram: a new story plays when you tap someone, then you land on their list
      if (id !== S.me && storyState(id) === 'st-new') openStory(id);
      break;
    }
    case 'tab': S.tab = v; renderMain(); break;
    // ---- family proposals ----
    case 'new-prop': openGift({ dest: 'question' }); break;
    case 'new-idea': openGift({ dest: 'keep' }); break;
    case 'gdest': idr.dest = v; renderItemModal(); break;
    case 'pick-open': idr.picking = true; renderItemModal(); break;
    case 'pick-img': idr.imageUrl = v; if (v) idr.photo = null; renderPicker(); break;
    case 'pick-done': idr.picking = false; renderItemModal(); break;
    case 'paste-img': pasteImage(); break;
    case 'vote': {
      const p = S.proposals.find(x => x.id === id); if (!p) break;
      const cur = (p.votes || {})[S.me] || 0, val = Number(v);
      run(backend.vote(DEV.fid, id, S.me, cur === val ? 0 : val));
      break;
    }
    case 'prop-decide': {
      const p = S.proposals.find(x => x.id === id); if (!p) break;
      const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top, 50);
      run(backend.updateProposal(DEV.fid, id, { status: 'decided', decidedAt: Date.now() }), `C'est noté : tu lui offres ça. ${prof(p.forId)?.name || ''} n'en saura rien.`);
      break;
    }
    case 'prop-undecide': run(backend.updateProposal(DEV.fid, id, { status: 'question' })); break;
    case 'prop-delete': {
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Confirmer'; break; }
      run(backend.deleteProposal(DEV.fid, id), 'Proposition supprimée'); break;
    }
    // ---- private ideas ----
    case 'idea-delete': {
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Confirmer'; break; }
      run(backend.deleteIdea(DEV.fid, id), 'Idée supprimée'); break;
    }
    case 'idea-propose': shareIdea(id, 'question', el); break;
    case 'idea-edit': { const i = S.ideas.find(x => x.id === id); if (i) openGift({ idea: i, dest: 'keep' }); break; }
    case 'idea-take': shareIdea(id, 'decided', el); break;
    // ---- item visibility ----
    case 'ivis': idr.everyone = v === 'all'; renderItemModal(); break;
    case 'ipick': { const k = idr.visibleTo.indexOf(id); if (k >= 0) idr.visibleTo.splice(k, 1); else idr.visibleTo.push(id); renderItemModal(); break; }
    // ---- stories ----
    case 'story-new': e.stopPropagation(); openStoryComposer(); break;
    case 'story-open': openStory(id); break;
    case 'story-close': closeStory(); break;
    case 'story-next': if (!swallowTap) storyNext(); break;
    case 'story-prev': if (!swallowTap) storyPrev(); break;
    case 'story-del': {
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Confirmer'; storyPause('del'); break; }
      run(backend.deleteStory(DEV.fid, id, rawComments.filter(c => c.storyId === id).map(c => c.id)), 'Story supprimée'); break;
    }
    case 'story-react': {
      el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
      sendStoryComment(v, el); break;
    }
    case 'cm-del': run(backend.deleteStoryComment(DEV.fid, id)); break;
    case 'story-post': postStory(el); break;
    case 'hide-invite': DEV.inviteHidden = true; saveDevice(); renderBanner(); break;
    case 'hide-install': DEV.installHidden = true; saveDevice(); renderBanner(); break;
    case 'install': if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; renderBanner(); }); } break;
    case 'copy-invite': {
      const text = inviteText();
      const copy = () => {
        if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => toast('Invitation copiée. Colle-la dans un message à ta famille.'), () => toast(text));
        else toast(text);
      };
      // On phones, open the share sheet (WhatsApp, SMS, Messenger...); elsewhere, copy the message
      if (navigator.share && matchMedia('(pointer: coarse)').matches) {
        navigator.share({ title: 'KDO, les envies de la famille', text }).catch(err => { if (err?.name !== 'AbortError') copy(); });
      } else copy();
      break;
    }
    case 'reload': location.reload(); break;
    case 'fsave': submitFamily(el); break;
    case 'fback': openFamily(); break;
    case 'fcreate': Object.assign(DEV, { code: v, fid: id, newFamily: true }); delete DEV.pendingCode; saveDevice(); closeModal(true); openProfile('onboard'); break;
    case 'changefam': { DEV = {}; saveDevice(); S.selected = null; S.locks = {}; openFamily(); break; }
    case 'pick': { const p = whoList.find(x => x.id === id); if (p) openPin({ mode: 'login', profile: p }); break; }
    case 'newme': openProfile('onboard'); break;
    case 'towho': closeModal(true); openWho(); break;
    case 'pk': pinKey(v); break;
    case 'pdel': if (pin && !pin.busy) { pin.value = pin.value.slice(0, -1); updateDots(); } break;
    case 'pback': if (!pin) break; if (pin.mode === 'login') openWho(); else closeModal(true); break;
    case 'pchangepin': { const me = S.me; closeModal(true); openPin({ mode: 'verify', pid: me }); break; }
    case 'logout': {
      closeModal(true);
      backend.signOut().catch(err => console.error(err)).finally(() => { S.selected = null; save(); endSession(); openWho(); });
      break;
    }
    case 'toggle': {
      const it = S.items.find(i => i.id === id), me = S.me;
      if (!it || it.ownerId === me || (it.reservedBy && it.reservedBy !== me)) return;
      if (it.reservedBy === me && Object.keys(S.res[id]?.joiners || {}).length && !el.classList.contains('armed')) {
        el.classList.add('armed'); el.querySelector('span:last-child').textContent = "Confirmer : les autres participants seront retirés"; break;
      }
      el.disabled = true;
      if (it.reservedBy === me) {
        backend.release(DEV.fid, it.id).then(() => toast("Libéré. Quelqu'un d'autre peut le prendre."), err => { el.disabled = false; toast(errorText(err)); });
      } else {
        const r = el.querySelector('.box').getBoundingClientRect();
        backend.reserve(DEV.fid, it, me).then(() => { burst(r.left + r.width / 2, r.top + r.height / 2); toast('Réservé ! Ça reste une surprise.'); },
          err => { el.disabled = false; toast(err.message === 'already' ? "Quelqu'un vient de le réserver juste avant toi." : errorText(err)); });
      }
      break;
    }
    case 'got': removeItem(id); break;
    case 'ack': run(S.res[id]?.by === S.me ? backend.release(DEV.fid, id) : backend.joinReservation(DEV.fid, id, S.me, false)); break;
    case 'join-res': case 'join-prop': {
      const doc = act === 'join-res' ? S.res[id] : S.proposals.find(x => x.id === id); if (!doc) break;
      const on = !(doc.joiners || {})[S.me];
      if (on) { const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top, 40); }
      run(act === 'join-res' ? backend.joinReservation(DEV.fid, id, S.me, on) : backend.joinProposal(DEV.fid, id, S.me, on), on ? 'Tu participes à ce cadeau' : 'Tu ne participes plus');
      break;
    }
    case 'new-relative': openProfile('relative'); break;
    case 'edit-profile': openProfile('edit', id); break;
    case 'ptab': pd.tab = v; refreshProfile(); break;
    case 'pmode': pd.mode = v; refreshProfile(); break;
    case 'pwho': pd.who = v; if (v === 'parents' && !pd.parents.length) pd.parents = [S.me]; refreshParents(); break;
    case 'ppar': {
      if (pd.wasParent && id === S.me) break;
      const k = pd.parents.indexOf(id); if (k >= 0) pd.parents.splice(k, 1); else pd.parents.push(id);
      refreshParents(); break;
    }
    case 'pset': setAvatar(el.dataset.k, v); refreshProfile(); break;
    case 'prandom': pd.avatar = randomAvatar(pd.avatar.kind, pd.avatar.bg); pd.mode = 'avatar'; refreshProfile(); break;
    case 'pnophoto': pd.photo = null; refreshProfile(); break;
    case 'psave': saveProfile(); break;
    case 'pdelete': deleteProfile(el); break;
    case 'new-item': openItem(); break;
    case 'edit-item': openItem(id); break;
    case 'itab': idr.tab = v; if (v === 'name') idr.url = ''; renderItemModal(); break;
    case 'inophoto': idr.photo = null; renderItemModal(); break;
    case 'isave': saveItem(el); break;
    case 'idelete': {
      if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Confirmer'; break; }
      const iid = idr.id; closeModal(); removeItem(iid); break;
    }
    case 'close': closeModal(); break;
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'svform') return;
  e.preventDefault();
  const input = $('#svtext'); if (!input) return;
  sendStoryComment(input.value, e.target.querySelector('button'));
  input.value = ''; input.blur();
});
document.addEventListener('focusin', e => { if (e.target.id === 'svtext') storyPause('type'); });
document.addEventListener('focusout', e => { if (e.target.id === 'svtext') storyResume('type'); });
// Holding a finger on a story pauses it, like on Instagram; letting go carries on without skipping
let holdTimer = null, holding = false, swallowTap = false;
document.addEventListener('pointerdown', e => {
  if (!viewerState || !e.target.closest('.sv-frame') || e.target.closest('.sv-reply, .sv-head, .sv-cdel')) return;
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { holding = true; storyPause('hold'); }, 250);
});
const endHold = () => {
  clearTimeout(holdTimer);
  if (!holding) return;
  holding = false; storyResume('hold');
  swallowTap = true; setTimeout(() => { swallowTap = false; }, 350);
};
document.addEventListener('pointerup', endHold);
document.addEventListener('pointercancel', endHold);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pname' && pd) pd.name = t.value;
  if (t.id === 'scap' && sd) sd.caption = t.value;
  if (!idr) return;
  if (t.id === 'iurl') onUrlInput(t.value);
  if (t.id === 'ititle') { idr.title = t.value; idr.autoTitle = !t.value; refreshThumb(); }
  if (t.id === 'iprice') idr.price = t.value;
  if (t.id === 'inote') idr.note = t.value;
});
document.addEventListener('change', async e => {
  const t = e.target;
  if ((t.id === 'pphoto' || t.id === 'iphoto') && t.files && t.files[0]) {
    try {
      if (t.id === 'pphoto') { pd.photo = await readImage(t.files[0], 256, true); refreshProfile(); }
      else { idr.photo = await readImage(t.files[0], 480, false); renderItemModal(); }
    } catch (err) { toast("Ce fichier n'a pas pu être lu comme une image."); }
  }
  if (t.id === 'sphoto' && t.files && t.files[0] && sd) {
    try { sd.caption = $('#scap')?.value || sd.caption; sd.photo = await storyPhoto(t.files[0]); renderStoryComposer(); }
    catch (err) { toast("Ce fichier n'a pas pu être lu comme une image."); }
  }
});
document.addEventListener('paste', e => {
  if (!idr || $('#modal').hidden) return;
  const file = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'))?.getAsFile();
  if (file) { e.preventDefault(); usePastedImage(file); }
});
document.addEventListener('keydown', e => {
  if (viewerState) {
    // Typing a message: the arrows move in the text, Escape just leaves the field
    if (e.target.id === 'svtext') { if (e.key === 'Escape') e.target.blur(); return; }
    if (e.key === 'Escape') { closeStory(); return; }
    if (e.key === 'ArrowRight') { storyNext(); return; }
    if (e.key === 'ArrowLeft') { storyPrev(); return; }
  }
  if (pin && !$('#modal').hidden) {
    if (/^\d$/.test(e.key)) { e.preventDefault(); pinKey(e.key); return; }
    if (e.key === 'Backspace' && !pin.busy) { e.preventDefault(); pin.value = pin.value.slice(0, -1); updateDots(); return; }
  }
  if (e.key === 'Escape') {
    if (!$('#modal').hidden) closeModal();
  }
  if (e.key === 'Enter' && !$('#modal').hidden && e.target.matches('input[type=text],input[type=url]')) {
    e.preventDefault();
    $('#panel').querySelector('[data-act="isave"],[data-act="psave"],[data-act="fsave"]')?.click();
  }
});
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; renderBanner(); });
addEventListener('appinstalled', () => { installEvt = null; renderBanner(); });

// ================= Start =================
async function boot() {
  render();
  try { backend = MOCK ? createMockBackend() : await createFirebaseBackend(); }
  catch (e) {
    console.error(e);
    showModal(`<div class="fam-intro">${GIFT}<h2>Pas de connexion</h2><p class="hint">KDO n'arrive pas à joindre sa base de données. Vérifie ta connexion internet, puis réessaie.</p><button class="btn" data-act="reload">Réessayer</button></div>`, true);
    return;
  }
  if (!DEV.fid) { openFamily(); return; }
  if (DEV.newFamily) { openProfile('onboard'); return; }
  try {
    const me = await backend.waitForAuth();
    if (me) {
      const people = await backend.listProfiles(DEV.fid);
      if (people.some(p => p.id === me && !p.managed)) { startSession(me); return; }
      await backend.signOut();
    }
  } catch (e) { console.error(e); }
  openWho();
}
if ('serviceWorker' in navigator && !MOCK && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(err => console.error(err));
window.KDO = { S, dev: () => DEV, backend: () => backend, avatarSVG, productIcon, cleanImageList, KINDS, EMOS, HAIR_STYLES, HATS, GLASSES, ACCS, momentsFor };
boot();
